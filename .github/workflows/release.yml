# v* etiketi itildiğinde Windows, macOS ve Linux paketlerini derler, GitHub Release'e
# yükler ve SHA256SUMS.txt ekler.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Etiket ile sürüm uyuşuyor mu
        shell: bash
        run: |
          VER=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          [ "$GITHUB_REF_NAME" = "v$VER" ] || { echo "Etiket $GITHUB_REF_NAME, tauri.conf.json sürümü $VER"; exit 1; }
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ github.ref_name }}
          releaseName: C Launcher ${{ github.ref_name }}
          releaseBody: "İşletim sisteminize uygun dosyayı indirin. Dosyaları SHA256SUMS.txt ile doğrulayabilirsiniz."
          releaseDraft: false
          args: ${{ matrix.args }}
      - name: Taşınabilir Linux paketi
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/c-launcher
          cp target/release/c-launcher pkg/c-launcher/
          cp src-tauri/icons/icon.png pkg/c-launcher/c-launcher.png
          cp LICENSE pkg/c-launcher/
          tar -C pkg --owner=0 --group=0 -czf "c-launcher-$VER-linux-x86_64.tar.gz" c-launcher
          gh release upload "$GITHUB_REF_NAME" "c-launcher-$VER-linux-x86_64.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt latest.json
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
