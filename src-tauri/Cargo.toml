[package]
name = "c-launcher"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "C Launcher: cafercan'ın uygulamalarını kurar, günceller ve açar"
default-run = "c-launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
tauri-plugin-dialog = "2"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
